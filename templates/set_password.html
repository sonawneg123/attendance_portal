{% extends "base.html" %}
{% block title %}पासवर्ड सेट करा · {{ shop_name }}{% endblock %}
{% block content %}
{% include "_hero.html" %}
<div class="card narrow">
  <h1>पासवर्ड सेट करा</h1>
  <p class="muted">नमस्कार, <strong>{{ user.name }}</strong>! कोड बरोबर आहे. पुढे जाण्यासाठी स्वतःचा पासवर्ड सेट करणे आवश्यक आहे.</p>
  <form method="post">
    {{ csrf_input() }}
    <label>नवीन पासवर्ड (किमान ४ अक्षरे)
      <input type="password" name="password" required minlength="4" autocomplete="new-password" autofocus>
    </label>
    <label>पासवर्ड पुन्हा लिहा
      <input type="password" name="password2" required minlength="4" autocomplete="new-password">
    </label>
    <button class="btn primary block">पासवर्ड सेट करा</button>
  </form>
</div>
{% endblock %}
