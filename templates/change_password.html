{% extends "base.html" %}
{% block title %}पासवर्ड बदला · {{ shop_name }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>पासवर्ड बदला</h1>
  <form method="post">
    {{ csrf_input() }}
    <label>सध्याचा पासवर्ड
      <input type="password" name="old" required autocomplete="current-password">
    </label>
    <label>नवीन पासवर्ड (किमान ४ अक्षरे)
      <input type="password" name="password" required minlength="4" autocomplete="new-password">
    </label>
    <label>नवीन पासवर्ड पुन्हा लिहा
      <input type="password" name="password2" required minlength="4" autocomplete="new-password">
    </label>
    <button class="btn primary block">पासवर्ड बदला</button>
  </form>
</div>
{% endblock %}
