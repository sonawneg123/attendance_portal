# Render Blueprint: मोफत वेब सर्व्हिस (Render) + डेटाबेस Supabase (मोफत) वर.
# DATABASE_URL Render Dashboard मध्ये स्वतः टाकायची आहे (Supabase → Connect → Session pooler string).
services:
  - type: web
    name: hajeri-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --threads 4 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false          # Supabase ची Session pooler string (पोर्ट 5432) इथे पेस्ट करा
      - key: SECRET_KEY
        generateValue: true
      - key: SETUP_KEY         # पहिल्यांदा Admin बनवताना लागणारी किल्ली
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: SHOP_NAME
        value: हजेरी पोर्टल
      - key: FULL_DAY_HOURS
        value: "8"
